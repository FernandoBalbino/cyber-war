services:
  - type: web
    name: cyber-war
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm ci --omit=dev
    startCommand: node server/index.ts
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: CLIENT_ORIGIN
        value: https://fernandobalbino.github.io
